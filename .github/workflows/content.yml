name: Content integrity
on:
  push:
    branches: [main, feat/jarvis-unified-guide]
  pull_request:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/validate-content.ts
